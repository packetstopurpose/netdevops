---
- name: NetDevOps - Fabric Configuration Deployment
  hosts: all
  gather_facts: false
  become: true
  become_method: enable
  tasks:
    - name: Verify compiled configuration exists locally
      delegate_to: localhost
      become: false
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../compiled_configs/{{ inventory_hostname }}.cfg"
      register: config_file
      failed_when: not config_file.stat.exists

    - name: Deploy configuration via Arista eAPI
      arista.eos.eos_config:
        src: "{{ playbook_dir }}/../compiled_configs/{{ inventory_hostname }}.cfg"
        save_when: modified
        replace: block
