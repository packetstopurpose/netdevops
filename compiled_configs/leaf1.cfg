! Target Configuration for leaf1
! Base System & Services
ip routing
hostname leaf1
dns domain lab.netdevops.local
ip name-server 1.1.1.1
ip name-server 8.8.8.8
ntp server 172.20.20.1

! Loopback Interface
interface Loopback0
   description "Router-ID / Management Loopback"
   ip address 10.0.0.11/32

! Physical Interfaces
interface Ethernet1
   description p2p_spine1
   no switchport
   ip address 10.1.1.2/30
interface Ethernet2
   description p2p_spine2
   no switchport
   ip address 10.1.2.2/30

! VLAN Provisioning
vlan 10
   name WEB_DATA
vlan 20
   name APP_DATA
vlan 30
   name DB_DATA

! BGP Routing Engine
router bgp 65101
   no shutdown
   router-id 10.0.0.11
   no bgp default ipv4-unicast

   
