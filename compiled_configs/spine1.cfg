! Target Configuration for spine1
! Base System & Services
ip routing
hostname spine1
dns domain lab.netdevops.local
ip name-server 1.1.1.1
ip name-server 8.8.8.8
ntp server 172.20.20.1

! Loopback Interface
interface Loopback0
   description "Router-ID / Management Loopback"
   ip address 10.0.0.1/32

! Physical Interfaces
interface Ethernet1
   description p2p_leaf1
   no switchport
   ip address 10.1.1.1/30
interface Ethernet2
   description p2p_leaf2
   no switchport
   ip address 10.1.1.5/30
interface Ethernet3
   description p2p_leaf3
   no switchport
   ip address 10.1.1.9/30
interface Ethernet4
   description p2p_leaf4
   no switchport
   ip address 10.1.1.13/30


! BGP Routing Engine
router bgp 65000
   no shutdown
   router-id 10.0.0.1
   no bgp default ipv4-unicast

   
