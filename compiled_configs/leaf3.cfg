! Target Configuration for leaf3
! Base System & Services
ip routing
hostname leaf3
dns domain lab.netdevops.local
ip name-server 1.1.1.1
ip name-server 8.8.8.8
ntp server 172.20.20.1

! Loopback Interface
interface Loopback0
   description "Router-ID / Management Loopback"
   ip address 10.0.0.13/32

! Physical Interfaces
interface Ethernet1
   description p2p_spine1
   no switchport
   ip address 10.1.1.10/30
interface Ethernet2
   description p2p_spine2
   no switchport
   ip address 10.1.2.10/30

! VLAN Provisioning
vlan 10
   name WEB_DATA
vlan 20
   name APP_DATA
vlan 30
   name DB_DATA

! BGP Routing Engine
router bgp 65103
   no shutdown
   router-id 10.0.0.13
   no bgp default ipv4-unicast

   
